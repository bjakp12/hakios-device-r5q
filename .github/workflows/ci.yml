name: r5q CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build-loader:
    # HakiOS documents XNU source builds on macOS with Xcode's toolchain.
    runs-on: macos-15
    steps:
      - name: Check out the r5q device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out the common HakiOS repository
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: main
          path: hakios

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install XNU and loader build dependencies
        run: |
          brew install autoconf automake bison flex llvm lld

      - name: Integrate the device configuration and loader profile
        run: |
          mkdir -p hakios/devices/r5q
          cp -a device/. hakios/devices/r5q/
          rm -rf hakios/devices/r5q/.git
          python3 device/scripts/apply-r5q-loader.py hakios/xnuloader/loader.c

      - name: Validate the device and its kernel configuration
        working-directory: hakios
        run: |
          python3 tools/hakios-device.py check r5q
          make r5q_defconfig
          make config

      - name: Build the Apple-free loader
        working-directory: hakios
        run: PATH="$(brew --prefix lld)/bin:$(brew --prefix llvm)/bin:$PATH" make loader-open

      - name: Build the configured XNU kernel
        working-directory: hakios
        run: |
          export PATH="$(brew --prefix bison)/bin:$(brew --prefix flex)/bin:$PATH"
          make kernel JOBS=3

      - name: Package an Apple-free first-boot payload
        working-directory: hakios
        run: |
          make hello
          python3 xnuloader/mkpayload.py -o r5q-open-test.xnup \
            kernel=hakios-kernel ramdisk=userland/hello \
            --cmdline "$(python3 tools/hakios-config.py args)"

      - name: Upload the kernel and loader candidates
        uses: actions/upload-artifact@v4
        with:
          name: r5q-kernel-loader-candidate
          path: |
            hakios/hakios-kernel
            hakios/xnuloader/loader.efi
            hakios/r5q-open-test.xnup
          if-no-files-found: error

  package-ram-boot-candidate:
    needs: validate-and-build-loader
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the r5q device repository
        uses: actions/checkout@v4
        with:
          path: device

      - name: Check out the common HakiOS repository
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-xnu-kernel
          ref: main
          path: hakios

      - name: Check out the pinned HakiOS UEFI tools
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-uefi
          ref: 1c6522893266157506c767e2ca427053ed3634a8
          path: hakios/uefi

      - name: Check out the HakiOS reference mkbootimg tool
        uses: actions/checkout@v4
        with:
          repository: oosexgang/hakios-sm7325
          ref: main
          path: redwood-reference
          sparse-checkout: prebuilt

      - name: Install U-Boot build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bc bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu libgnutls28-dev libssl-dev swig

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Integrate the r5q files
        run: |
          mkdir -p hakios/devices/r5q hakios/devices/r5q/prebuilt
          cp -a device/. hakios/devices/r5q/
          rm -rf hakios/devices/r5q/.git
          cp redwood-reference/prebuilt/mkbootimg.py hakios/devices/r5q/prebuilt/mkbootimg.py
          cp device/uefi/files/Resources/DTBs/r5q.dtb hakios/devices/r5q/prebuilt/device-tree.dtb
          python3 device/scripts/apply-r5q-loader.py hakios/xnuloader/loader.c
          python3 device/scripts/configure-r5q-mkubootimg.py hakios/tools/mkubootimg.py

      - name: Download the configured XNU kernel and open loader
        uses: actions/download-artifact@v4
        with:
          name: r5q-kernel-loader-candidate
          path: candidate

      - name: Prepare the HakiOS U-Boot tree
        working-directory: hakios
        run: |
          uefi/u-boot/apply.sh r5q
          python3 devices/r5q/scripts/harden-r5q-uboot-loader.py u-boot/cmd/hakios.c

      - name: Build Qualcomm U-Boot for r5q
        working-directory: hakios
        env:
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: "2"
        run: bash devices/r5q/scripts/build-r5q-uboot.sh

      - name: Package the Android fastboot boot image
        working-directory: hakios
        run: |
          cp "$GITHUB_WORKSPACE/candidate/hakios-kernel" hakios-kernel
          cp "$GITHUB_WORKSPACE/candidate/loader.efi" xnuloader/loader.efi
          cp "$GITHUB_WORKSPACE/candidate/r5q-open-test.xnup" r5q-open-test.xnup
          python3 tools/mkubootimg.py -d r5q \
            -u u-boot/build-r5q/u-boot.bin \
            -l xnuloader/loader.efi \
            -p r5q-open-test.xnup \
            --base 0 \
            --kernel-offset 0x8000 \
            --ramdisk-offset 0x02000000 \
            --tags-offset 0x01e00000 \
            --pagesize 4096 \
            -o r5q-fastboot-candidate.img

      - name: Verify the Android boot header and HKUB payload
        working-directory: hakios
        run: |
          python3 -c 'import struct; from pathlib import Path; p=Path("r5q-fastboot-candidate.img").read_bytes(); assert p[:8] == b"ANDROID!"; ksz,kaddr,rsz,raddr,tags,page,ver=struct.unpack_from("<7I",p,8)[0],struct.unpack_from("<I",p,12)[0],struct.unpack_from("<I",p,16)[0],struct.unpack_from("<I",p,20)[0],struct.unpack_from("<I",p,32)[0],struct.unpack_from("<I",p,36)[0],struct.unpack_from("<I",p,40)[0]; roff=page+((ksz+page-1)//page)*page; assert (page,ver,kaddr,raddr,tags)==(4096,1,0x8000,0x2000000,0x1e00000); assert p[page:page+2]==b"\x1f\x8b" and p[roff:roff+4]==b"HKUB" and rsz>0; print(f"validated Android boot image v{ver}, page={page}, size={len(p)}")'

      - name: Upload the fastboot RAM-boot candidate
        uses: actions/upload-artifact@v4
        with:
          name: r5q-fastboot-ram-candidate
          path: hakios/r5q-fastboot-candidate.img
          if-no-files-found: error
