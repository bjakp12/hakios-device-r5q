# devices/r5q/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device r5q
	title       Samsung Galaxy S10 Lite (SM-G770F)
	vendor      Samsung
	soc         sm8150
	defconfig   r5q_defconfig
	maintainer  Port in progress
	status      display     missing   no R5Q UEFI/loader platform or framebuffer has been verified yet
	status      touch       missing   Samsung sec_ts on I2C 0x48 (GPIO 87); no HakiOS driver yet
	status      gpu         missing   SM8150 Adreno 640; HakiOS GPU driver targets the Adreno 642L and is not compatible
	status      storage     missing   UFS path has not been ported or tested on R5Q
